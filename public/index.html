<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hearts Score Sheet</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- AUTH VIEW -->
  <div id="view-auth" class="view">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-suit">♥</span>
        <h1>Hearts</h1>
        <span class="auth-suit">♠</span>
      </div>
      <p class="auth-subtitle">Score Sheet</p>

      <div class="tab-bar">
        <button class="tab active" data-tab="login">Sign In</button>
        <button class="tab" data-tab="register">Register</button>
      </div>

      <form id="form-login" class="auth-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password" required />
        </div>
        <div id="login-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <form id="form-register" class="auth-form hidden">
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" autocomplete="new-password" required />
        </div>
        <div id="register-error" class="form-error hidden"></div>
        <div id="register-success" class="form-success hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="view-dashboard" class="view hidden">
    <header class="topbar">
      <div class="topbar-brand">♥ Hearts</div>
      <div class="topbar-right">
        <span id="dash-username" class="username-label"></span>
        <button id="btn-logout" class="btn btn-ghost">Sign Out</button>
      </div>
    </header>
    <main class="container">
      <div class="section-header">
        <h2>Your Games</h2>
        <button id="btn-new-game" class="btn btn-primary">+ New Game</button>
      </div>
      <div id="games-list" class="games-grid">
        <p class="empty-state">No games yet. Start a new one!</p>
      </div>
    </main>
  </div>

  <!-- NEW GAME VIEW -->
  <div id="view-new-game" class="view hidden">
    <header class="topbar">
      <button id="btn-back-from-new" class="btn btn-ghost">← Back</button>
      <div class="topbar-brand">New Game</div>
      <div style="width:80px"></div>
    </header>
    <main class="container narrow">
      <form id="form-new-game" style="display:flex;flex-direction:column;gap:16px">
        <div class="field">
          <label for="game-name">Game Name</label>
          <input id="game-name" type="text" placeholder="e.g. Game Night" required />
        </div>
        <div class="field">
          <label>Players <span style="color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">(2–6)</span></label>
          <div id="player-inputs">
            <div class="player-row"><input type="text" class="player-name" placeholder="Player 1" required /></div>
            <div class="player-row"><input type="text" class="player-name" placeholder="Player 2" required /></div>
            <div class="player-row"><input type="text" class="player-name" placeholder="Player 3" required /></div>
            <div class="player-row"><input type="text" class="player-name" placeholder="Player 4" required /></div>
          </div>
          <div class="player-controls">
            <button type="button" id="btn-add-player" class="btn btn-ghost btn-sm">+ Add Player</button>
            <button type="button" id="btn-remove-player" class="btn btn-ghost btn-sm">− Remove</button>
          </div>
        </div>
        <div id="new-game-error" class="form-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-block">Start Game</button>
      </form>
    </main>
  </div>

  <!-- GAME VIEW -->
  <div id="view-game" class="view hidden">
    <div class="game-page">

      <div class="game-top-nav">
        <button id="btn-back-from-game" class="btn-back">← Games</button>
        <div class="game-top-actions">
          <button id="btn-undo-round" class="btn-text">Undo Round</button>
          <button id="btn-delete-game" class="btn-text danger">Delete</button>
        </div>
      </div>

      <div class="game-hero">
        <p class="game-hero-label">♥ <span id="game-hero-name"></span> ♥</p>
        <h1 class="game-hero-title">Hearts</h1>
        <p class="game-hero-sub">First to 100 loses · Low score wins</p>
      </div>

      <div id="game-complete-banner" class="complete-banner hidden">
        <span>♥</span>
        <strong id="game-winner-text"></strong>
        <span>♥</span>
      </div>

      <div class="score-card">
        <table id="score-table" class="score-table">
          <thead><tr id="score-header"></tr></thead>
          <tbody id="score-body"></tbody>
          <tfoot><tr id="score-totals"></tr></tfoot>
        </table>
      </div>

      <div id="round-entry" class="round-entry-card hidden">
        <div class="round-entry-label">Round <span id="next-round-num">1</span></div>

        <div class="entry-section">
          <div class="entry-section-label">🌙 Shoot the Moon?</div>
          <div id="moon-player-btns" class="player-btn-row"></div>
        </div>

        <div class="entry-section">
          <div class="entry-section-label">
            <span class="suit-diamond">♦</span> Jack of Diamonds? (−10)
          </div>
          <div id="jod-player-btns" class="player-btn-row"></div>
        </div>

        <div class="entry-section">
          <div class="entry-section-label">
            <span class="suit-heart">♥</span> Enter scores (must sum to 26)
          </div>
          <div id="score-input-container"></div>
        </div>

        <div id="round-entry-error" class="form-error hidden"></div>
        <button id="btn-add-round" class="btn-gold-block">Add Round</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js"></script>
</body>
</html>
